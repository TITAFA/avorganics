<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe3c5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Avorganics">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<link rel="apple-touch-icon" href="icon-192.png">
<title>Avorganics Reparto</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%}
body.kb nav{display:none}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: una columna tipo libreta de reparto, navegación fija abajo, hojas que suben para capturar. */
:root{--bg:#efe3c5;--sf:#f8f0dc;--sf2:#e8d9b4;--ink:#2a2f1c;--mu:#66664a;--ln:#d2c196;
--olive:#69782c;--grass:#3f8a26;--grass-d:#2f6a1b;--on:#fff;
--pend:#9a4a1e;--pend-bg:#f1dccb;--ent:#6d5d12;--ent-bg:#ece2b0;--cob:#2f6a1b;--cob-bg:#d6e8bd;
--f-d:"Bricolage Grotesque",system-ui,sans-serif;--f-b:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;
padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 100px}
.app{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.1rem;font-weight:800;margin-bottom:6px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
#logo{height:92px;width:auto;max-width:42%;object-fit:contain}
.top small{color:var(--mu);text-transform:capitalize}
.brand{font-family:var(--f-d);font-weight:800;color:var(--grass);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.s{display:none}.s.on{display:block}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.hint{color:var(--mu);font-size:.85rem;margin:0 0 8px}
.sub{color:var(--mu);font-size:.88rem}
.late{color:var(--pend);font-weight:700}
.btn{border:0;background:var(--grass);color:var(--on);font-weight:700;padding:10px 16px;border-radius:10px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.w{width:100%}
.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--ln)}
.btn.d{background:transparent;color:var(--pend);border:1.5px solid var(--pend)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--ln);background:var(--sf);border-radius:99px;padding:6px 14px;font-weight:500;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.k b{display:block;font-family:var(--f-d);font-size:1.3rem;line-height:1.15;font-variant-numeric:tabular-nums}
.k span{font-size:.78rem;color:var(--mu)}
.k.big{background:var(--cob-bg);border-color:var(--grass)}
.k.neg{background:var(--pend-bg);border-color:var(--pend)}.k.neg b{color:var(--pend)}
.o{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--pend);border-radius:10px;padding:12px;margin-bottom:10px}
.o.entregado{border-left-color:#b59c1e}.o.cobrado{border-left-color:var(--grass)}
.oh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.oh>div{min-width:0}
.ob{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--olive);color:var(--on);font-weight:800;font-size:.8rem;margin-right:6px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:.76rem;white-space:nowrap}
.tag.pendiente{background:var(--pend-bg);color:var(--pend)}
.tag.entregado{background:var(--ent-bg);color:var(--ent)}
.tag.cobrado{background:var(--cob-bg);color:var(--cob)}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.li:last-child{border-bottom:0}
.li>div{min-width:0}
.li b{display:block;overflow-wrap:anywhere}
.empty{color:var(--mu);text-align:center;padding:22px 8px}
.empty b{display:block;color:var(--ink);font-family:var(--f-d);margin-bottom:4px;font-size:1.05rem}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f .w{grid-column:1/-1}
label{display:block;font-size:.8rem;font-weight:700;color:var(--mu)}
input,select,textarea{width:100%;margin-top:3px;padding:10px;border:1.5px solid var(--ln);border-radius:9px;background:var(--bg);min-height:44px}
textarea{min-height:64px;resize:vertical}
svg.ch{width:100%;height:auto;display:block}
.tx{fill:var(--mu);font-size:11px;font-family:var(--f-b)}
.bar{display:grid;grid-template-columns:90px minmax(0,1fr) 78px;gap:8px;align-items:center;margin:7px 0;font-size:.86rem}
.bar .t{background:var(--sf2);border-radius:5px;height:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--olive)}
.bar span:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sf);border-top:1px solid var(--ln);display:flex;gap:2px;
padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mu);font-weight:700;font-size:.72rem;padding:10px 1px;border-radius:9px;min-height:44px}
nav button[aria-selected="true"]{background:var(--olive);color:var(--on)}
#ov{position:fixed;inset:0;background:rgba(10,12,5,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
#sh{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tk{background:#fff;color:#1a1a1a;border-radius:10px;padding:16px;text-align:center}
.tk p{margin:3px 0}
.tk #qr{display:flex;justify-content:center;margin:10px 0}
.tk code{font-size:.78rem;overflow-wrap:anywhere}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:92vw;text-align:center}
#ts.on{opacity:1}
#off{background:var(--pend-bg);color:var(--pend);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:700}
.prog{height:10px;background:var(--sf2);border-radius:6px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--grass)}
#sp{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;transition:opacity .45s}
#sp.off{opacity:0;pointer-events:none}
#sp img{width:min(78vw,340px);height:auto;max-height:62vh;object-fit:contain}
#sp span{color:var(--mu);font-weight:700;letter-spacing:.06em;font-size:.85rem;text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dw{font-size:.7rem;font-weight:700;color:var(--mu);text-align:center;padding:2px 0}
.cal button.d{aspect-ratio:1/1.2;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--ink);padding:3px 1px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0;font-size:.84rem;font-weight:700;line-height:1}
.cal button.d small{font-size:.6rem;font-weight:700;color:var(--ink);min-height:.6rem}
.cal button.d.hoy{outline:2px solid var(--ink);outline-offset:-2px}
.dots{display:flex;gap:2px;min-height:6px}
.dots i,.leg i{display:inline-block;width:7px;height:7px;border-radius:50%}
.dp{background:var(--pend)}.dv{background:var(--grass)}.dg{background:#c9a227}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--mu);margin-top:10px}
.leg i{margin-right:4px}
#auth{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:45;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;display:flex;align-items:flex-start;justify-content:center;padding:10px max(16px,env(safe-area-inset-left,0px)) 40vh}
#auth .ac{width:100%;max-width:420px}
#alogo{height:64px;width:auto;display:block;margin:0 auto 6px}
#auth h2{text-align:center;margin-bottom:10px}
#auth label{margin-top:10px}
.err{color:var(--pend);font-weight:700;font-size:.88rem;margin:8px 0 0;min-height:1.2em}
#fxbox{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.pc{position:absolute;top:-30px;display:block;animation:fall var(--d) cubic-bezier(.3,.1,.6,1) forwards}
.pc.bill{width:36px;height:19px;border-radius:3px;background:#4f9a37;border:2px solid #2f6a1b;box-shadow:inset 0 0 0 3px #7bbf5e}
.pc.coin{width:22px;height:22px;border-radius:50%;background:#d8a62a;border:2px solid #9a7412;box-shadow:inset 0 0 0 3px #efc95a}
.pc.cf{width:9px;height:15px;border-radius:2px}
@keyframes fall{to{transform:translate3d(var(--dx),112vh,0) rotate(var(--r))}}
#win{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:41;background:var(--sf);border:2px solid var(--grass);border-radius:16px;padding:18px 26px;text-align:center;max-width:86vw;pointer-events:none;transition:transform .25s,opacity .25s}
#win.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#win svg{width:54px;height:54px;display:block;margin:0 auto 6px}
#win b{display:block;font-family:var(--f-d);font-size:1.6rem;color:var(--grass-d);line-height:1.15}
#win span{color:var(--mu)}
@media (prefers-reduced-motion:reduce){#ts,#sp,#win{transition:none}}
/* productos, precios y pedido */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--bg);border:1.5px solid var(--ln);border-radius:14px;padding:14px 8px;min-height:44px}
.pcard b{font-family:var(--f-d);font-size:1.05rem}
.pcard .cals{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.pcard .cals i{font-style:normal;font-size:.74rem;font-weight:700;background:var(--cob-bg);color:var(--cob);border-radius:99px;padding:2px 8px}
.mid{display:flex;justify-content:center;margin-top:14px}
.bigbtn{display:inline-flex;align-items:center;gap:10px;border:2px dashed var(--olive);background:var(--bg);color:var(--grass-d);font-weight:800;font-size:1.05rem;border-radius:16px;padding:16px 22px;min-height:56px}
.bigbtn span{font-size:1.6rem;line-height:1}
.pvw{display:flex;justify-content:center;margin:0 0 10px}
.prc{border:1.5px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}
.prc.on{border-color:var(--olive);background:var(--sf)}
.prh{display:flex;align-items:center;gap:10px;font-size:1.05rem;color:var(--ink);font-weight:700}
.prh input{width:26px;height:26px;margin:0;min-height:0;flex:none}
.prf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.pmini{display:flex;gap:4px;margin-top:4px}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.opb{display:flex;align-items:center;gap:8px;border:2px solid var(--ln);background:var(--bg);border-radius:14px;padding:8px 14px 8px 10px;font-weight:700;min-height:52px}
.opb[aria-pressed="true"]{border-color:var(--grass);background:var(--cob-bg);color:var(--grass-d)}
.seg{display:flex;margin-top:3px}
.seg button{flex:1;border:1.5px solid var(--ln);background:var(--bg);font-weight:700;min-height:48px;padding:4px 4px;font-size:.8rem;white-space:nowrap}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0;border-left:0}
.seg button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--on)}
.step{display:flex;gap:8px;margin-top:3px}
.step input{flex:1;min-width:0;text-align:center;font-size:1.3rem;font-weight:800;margin:0}
.step button{width:56px;flex:none;border:0;background:var(--olive);color:var(--on);font-size:1.7rem;font-weight:800;border-radius:12px;min-height:48px}
.tbig{font-size:1.35rem;margin:12px 0 4px}
.det{margin:8px 0;border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
.det summary{font-weight:700;color:var(--mu)}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;color:var(--ink);font-size:.9rem}
.chk input{width:24px;height:24px;margin:0;min-height:0;flex:none}
.sc{display:flex;align-items:center;gap:8px;border:2px solid var(--ln);background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:700;color:var(--ink);font-size:.95rem;min-height:44px}
.sc input{width:22px;height:22px;margin:0;min-height:0}
</style>
</head><body>
<div class="app">
<div class="top"><img id="logo" alt="Avorganics, Tacámbaro, Michoacán" src="icon-512.png"><div><h1 id="hT">Pedido del día</h1><small id="hF"></small></div></div>
<div id="off" hidden>No hay conexión con la base compartida. Recarga la página.</div>

<section class="s on" id="s-hoy">
  <div class="row2" style="justify-content:space-between;align-items:center;margin-bottom:12px">
    <div class="chips" id="hTabs" style="margin:0"></div>
    <div class="row2"><button class="btn" data-a="addo">+ Añadir</button><button class="btn o" data-a="addp">Recibí un pago</button></div>
  </div>
  <div id="hK"></div>
  <div id="hL"></div>
  <div id="hR"></div>
</section>

<section class="s" id="s-cal">
  <div class="row2" style="justify-content:space-between;align-items:center;flex-wrap:nowrap;margin-bottom:10px"><button class="btn o sm" data-a="mprev" aria-label="Mes anterior">◀</button><h2 id="mT" style="margin:0;text-transform:capitalize"></h2><button class="btn o sm" data-a="mnext" aria-label="Mes siguiente">▶</button></div>
  <div id="mK"></div>
  <div class="card"><div class="cal" id="mG"></div>
   <div class="leg"><span><i class="dp"></i>Pendiente</span><span><i class="dv"></i>Entregado</span><span><i class="dg"></i>Gasto</span><span>Más verde = más ventas</span></div></div>
  <div class="card"><h2 id="yH"></h2><div id="yC"></div></div>
</section>

<section class="s" id="s-cli">
  <div class="chips" id="cT"></div>
  <div class="row2" id="cBar" style="margin-bottom:12px"><input id="cq" placeholder="Buscar restaurante" aria-label="Buscar restaurante" style="flex:1;margin:0;min-width:0"><button class="btn" id="cNew" data-a="newc">+ Nuevo</button></div>
  <div class="card" id="cL"></div>
</section>

<section class="s" id="s-ven">
  <div class="chips" id="vT"></div>
  <div id="vK"></div>
  <div class="card"><h2 id="vH"></h2><div id="vC"></div></div>
  <div class="card"><h2>Costo y ganancia por restaurante</h2><div id="vG"></div></div>
  <div class="card"><h2>Temporadas</h2><div id="vE"></div></div>
  <div class="card"><h2>Últimas ventas</h2><div id="vL"></div></div>
</section>

<section class="s" id="s-gas">
  <div class="chips" id="gT"></div>
  <div id="gK"></div>
  <div class="card">
    <h2>Nuevo movimiento</h2>
    <div class="f">
      <div><label for="gt">Tipo</label><select id="gt"><option>Gasto</option><option>Inversión</option><option>Pago fijo</option></select></div>
      <div><label for="gc">Categoría</label><select id="gc"></select></div>
      <div><label for="gm">Monto (MXN)</label><input id="gm" type="number" inputmode="decimal" min="0"></div>
